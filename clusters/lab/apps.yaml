# Demo workloads the scenarios break. Applied only after infrastructure is ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: fleet
  path: ./apps
  prune: true
  # No wait: Ready means the revision was applied, not that the workloads are healthy. A broken rollout (the OOM
  # scenario) would otherwise hold Ready at Unknown, then False, and the operator's source mapper refuses a
  # Kustomization that is not Ready (ADR-0012). Workload health is Shadewright's to judge.
