# Cluster add-ons (the Shadewright install is clusters/lab/shadewright.yaml). The AKS Flux extension enforces multi-tenancy, so this
# object, its source and the configuration live in the same namespace (flux-system).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: fleet
  path: ./infrastructure
  prune: true
  wait: true
  # Substitutions apply only to the objects of the Kustomization that declares them, so the values the
  # parent receives from lab/flux.tf are forwarded explicitly. The parent replaces each ${VAR} below.
  postBuild:
    substitute:
      AZURE_TENANT_ID: "${AZURE_TENANT_ID}"
      MODEL_ENDPOINT: "${MODEL_ENDPOINT}"
      KEY_VAULT_URI: "${KEY_VAULT_URI}"
      ANALYSIS_STORE_URL: "${ANALYSIS_STORE_URL}"
      ANALYSIS_CONTAINER: "${ANALYSIS_CONTAINER}"
      OPERATOR_NAMESPACE: "${OPERATOR_NAMESPACE}"
