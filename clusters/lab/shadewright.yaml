# The Shadewright agent (analyzer and executor), vendored from the operator repository (infrastructure/shadewright,
# see its VENDOR file). After infrastructure, which creates the demo namespace its RoleBinding lives in, and before
# apps, so the agent is up when a scenario is switched on. The client IDs are the lab's workload identities,
# forwarded from the parent like in infrastructure.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shadewright
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: fleet
  path: ./infrastructure/shadewright-lab
  prune: true
  wait: true
  postBuild:
    substitute:
      ANALYZER_CLIENT_ID: "${ANALYZER_CLIENT_ID}"
      EXECUTOR_CLIENT_ID: "${EXECUTOR_CLIENT_ID}"
