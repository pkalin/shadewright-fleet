# The add-ons the scenarios need (the demo namespace, KEDA and Prometheus), the same path the lab applies, without
# substitutions.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: fleet
  path: ./infrastructure
  prune: true
  wait: true
