# The stateless StatefulSet the statefulset-oom scenario breaks. podinfo again (same image as web), but run as a
# StatefulSet with a headless Service and no volume claim: nothing here keeps data, so the lab pays for no disk and
# the restricted profile needs no fsGroup. Remediation PRs may change values in this file in place (for example the
# memory limit, SetContainerMemoryLimit), so keep every value literal: no patches or generators (ADR-0012).
# Two replicas on purpose: a rolling update goes from the highest ordinal down and waits for each pod to be Ready,
# so a broken template leaves cache-1 stuck and cache-0 untouched (scenarios/statefulset-oom/README.md).
# Image: https://github.com/stefanprodan/podinfo (6.17.0, multi-arch index digest on ghcr.io); the image's
# user "app" is uid 100, gid 101.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: demo
  labels:
    app.kubernetes.io/name: cache
    app.kubernetes.io/part-of: demo
spec:
  serviceName: cache
  replicas: 2
  revisionHistoryLimit: 3
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cache
        app.kubernetes.io/part-of: demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9797"
    spec:
      serviceAccountName: cache
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cache
          image: ghcr.io/stefanprodan/podinfo:6.17.0@sha256:fa2f27c1a8561097e5144bfc0853eba6054d743b68b03de4cad4675616ddefb0
          imagePullPolicy: IfNotPresent
          command:
            - ./podinfo
            - --port=9898
            - --port-metrics=9797
            - --level=info
          env:
            - name: PODINFO_UI_MESSAGE
              value: shadewright demo cache
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP
            - name: http-metrics
              containerPort: 9797
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
