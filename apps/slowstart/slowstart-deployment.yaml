# A workload whose pods always log a readiness failure while they start. For scenario matrix rows 13 and 14: web and
# worker have a startupProbe, and Kubernetes runs no readiness probe until the startup probe has succeeded, so
# they never emit a readiness "Unhealthy" event at start. This one has no startupProbe. Its readiness probe starts at
# once (initialDelaySeconds 0, every 3 seconds) and the container opens its port 20 seconds late: the shell sleeps
# first, then starts podinfo. The kubelet logs "Readiness probe failed: ... connection refused" at every start,
# and the pod is Ready about 25 seconds after it starts. The liveness probe waits 60 seconds so the kubelet does not
# kill the container while it sleeps. Same image, user and limits as web. Remediation PRs may change values in
# this file in place (for example the memory limit, SetContainerMemoryLimit), so keep every value literal: no
# patches or generators (ADR-0012).
# SCENARIO slowstart-oom (scenarios/slowstart-oom): after its 20 second sleep podinfo loads 36 MB into memory (it needs the writable /tmp volume below, the root filesystem is read-only), and the limit is 48Mi, below what the container holds (about 54Mi). The container is killed, restarts, sleeps again and fails its readiness probe again.
# Image: https://github.com/stefanprodan/podinfo (6.17.0, multi-arch index digest on ghcr.io); the image's
# user "app" is uid 100, gid 101.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slowstart
  namespace: demo
  labels:
    app.kubernetes.io/name: slowstart
    app.kubernetes.io/part-of: demo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: slowstart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slowstart
        app.kubernetes.io/part-of: demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9797"
    spec:
      serviceAccountName: slowstart
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slowstart
          image: ghcr.io/stefanprodan/podinfo:6.17.0@sha256:fa2f27c1a8561097e5144bfc0853eba6054d743b68b03de4cad4675616ddefb0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - sleep 20 && exec ./podinfo --port=9898 --port-metrics=9797 --level=info --stress-memory=36
          env:
            - name: PODINFO_UI_MESSAGE
              value: shadewright demo slowstart
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP
            - name: http-metrics
              containerPort: 9797
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 48Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
