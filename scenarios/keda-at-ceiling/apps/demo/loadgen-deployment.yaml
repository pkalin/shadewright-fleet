# Scenario keda-at-ceiling: steady HTTP load on the worker, so the Prometheus trigger asks for more replicas than
# the scenario's maxReplicaCount allows. About 13 requests per second in total (one curl, then sleep 0.07 s), which
# the trigger (threshold 5 per replica) turns into 3 replicas: above a ceiling of 2, within the ceiling of 3 on main.
# Same hardening as the worker (restricted Pod Security profile). The image is the worker's, which ships curl.
# demo's NetworkPolicies already allow the traffic (allow-http-in-namespace, allow-dns).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: demo
  labels:
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/part-of: demo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loadgen
        app.kubernetes.io/part-of: demo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: ghcr.io/stefanprodan/podinfo:6.17.0@sha256:fa2f27c1a8561097e5144bfc0853eba6054d743b68b03de4cad4675616ddefb0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - while true; do curl -s -o /dev/null --max-time 2 http://worker.demo.svc.cluster.local:9898/; sleep 0.07; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
