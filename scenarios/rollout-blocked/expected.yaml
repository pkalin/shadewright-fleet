apiVersion: scenarios.shadewright.io/v1alpha1
kind: Scenario
name: rollout-blocked
summary: The oom scenario plus a LimitRange with a container memory maximum of 56Mi, so the merged fix applies but its pods are refused and the old pod stays.
incident:
  reason: OOMKilled
  status: planned
  source: The same symptom as the oom scenario (the web container is OOMKilled at 48Mi), read from the container status by the collector. Observed for oom on the lab (see scenarios/oom); not run for this scenario on a lab. On Kind the LimitRange was checked by hand (see the README).
  object:
    apiVersion: apps/v1
    kind: Deployment
    namespace: demo
    name: web
diagnosis:
  status: planned
  evidence:
    - fact: OOMKilled from the container status (last state), not from an event reason
      source: the Incident reason, and the pod's lastState.terminated.reason
    - fact: the memory working set from Prometheus (container_memory_working_set_bytes) near the 48Mi limit
      source: a Prometheus query through the MetricsSource interface (planned, not wired into the analyzer yet)
outcome:
  type: pull-request
  status: planned
  note: The pull request is the one of the oom scenario (48Mi to 64Mi). After the merge Flux applies it, but the new ReplicaSet cannot create a pod with a 64Mi limit under the LimitRange, so the rollout never completes and the old pod keeps its old limit (MATRIX.md, row 4). Not run end to end.
  action: SetContainerMemoryLimit
  bounds:
    min: 64Mi
    max: 128Mi
  paths:
    - apps/demo/web-deployment.yaml
