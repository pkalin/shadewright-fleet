apiVersion: scenarios.shadewright.io/v1alpha1
kind: Scenario
name: oom-leak
summary: The web container's data volume is memory-backed and a load generator fills it at a steady rate, so the container is OOMKilled at a 64Mi limit and again, later, at a higher one.
incident:
  reason: OOMKilled
  status: planned   # the container status was seen on Kind (2026-11-13), but no agent ran there, so no Incident was created
  source: The kubelet writes lastState.terminated.reason on the container status; the collector's pod watch reads it, as in oom. On Kind on 2026-11-13 the container status showed reason OOMKilled, exit code 137, 2m25s after the pod started; no Incident exists because Kind has no agent.
  object:
    apiVersion: apps/v1
    kind: Deployment
    namespace: demo
    name: web
diagnosis:
  status: planned
  evidence:
    - fact: OOMKilled from the container status (last state), not from an event reason
      source: the Incident reason, and the pod's lastState.terminated.reason
    - fact: the memory working set grows in a straight line and has been near the limit at each kill (a leak, not a one-off allocation)
      source: a Prometheus query through the MetricsSource interface (container_memory_working_set_bytes over time; planned, not wired into the analyzer yet)
    - fact: the memory is held by a memory-backed emptyDir volume (the data volume, medium Memory), which counts against the container limit
      source: the Deployment's pod template (planned)
outcome:
  type: pull-request
  status: planned
  note: The first request is the same pull request as oom (SetContainerMemoryLimit on web, 64Mi to at most 96Mi). The point of the scenario is what comes after the merge. The new pod starts with an empty volume, the load keeps filling it, and the container is killed again about 6 minutes after the start (measured on Kind with a hand-made change to 96Mi, 2026-11-13). That is later than a delivery wait and inside the 10 minute window, so the request is expected to end Failed once the kill is seen after the rollout (scenarios/MATRIX.md, row 2). Planned, not run with an agent.
  action: SetContainerMemoryLimit
  bounds:
    min: 64Mi
    max: 128Mi
  paths:
    - apps/demo/web-deployment.yaml
