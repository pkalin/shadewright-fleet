name: PR title

# Squash merges use the pull request title as the commit message on main, so the title must follow
# Conventional Commits (see AGENTS.md, "Commits"). Reads only the event payload: no checkout, no secrets.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            revert
          scopes: |
            clusters
            infrastructure
            apps
            scenarios
            docs
            ci
            deps
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            The summary "{subject}" must start with a lower-case letter and must not end with a full stop.
