name: faultbox image

# On a tag faultbox-vX.Y.Z builds tools/faultbox for linux/amd64 and linux/arm64, pushes ghcr.io/pkalin/faultbox, signs
# the image index by digest with cosign keyless (GitHub OIDC, no key to store), attaches an SPDX SBOM per platform image as
# a signed attestation, and verifies both against the identity of this workflow. Same pattern as the operator's images.yml.
# The tag must point at a commit on main (checked in the first job, which has no write permission). Only the publish job
# has packages: write and id-token: write. A tag gives the image the tag X.Y.Z (a pre-release X.Y.Z-rc.N), never latest.
# After a release, scripts/bump-faultbox-digest.sh <digest> moves the manifests that reference the image.
on:
  push:
    tags: ["faultbox-v*"]

permissions: {}

jobs:
  check-tag:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#faultbox-v}"
          printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "not a version tag: ${TAG}" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Require the tag to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "${GITHUB_REF_NAME} is not on main" >&2; exit 1; }

  publish:
    name: Publish faultbox
    needs: check-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/faultbox
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ needs.check-tag.outputs.version }}

      - name: Build and push both architectures
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/faultbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Always by digest: a tag can move, the digest names the pushed index.
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Resolve the platform images
        id: platforms
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: scripts/image-platform-digests.sh "${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"

      # Syft scans each platform image by its own digest, so each SBOM describes exactly that platform.
      - name: Generate the SPDX SBOM (linux/amd64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.platforms.outputs.amd64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate the SPDX SBOM (linux/arm64)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.platforms.outputs.arm64 }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOMs
        env:
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
          SBOM_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          cosign attest --yes --type spdxjson --predicate "${SBOM_DIR}/sbom-amd64.spdx.json" "${IMAGE}@${AMD64}"
          cosign attest --yes --type spdxjson --predicate "${SBOM_DIR}/sbom-arm64.spdx.json" "${IMAGE}@${ARM64}"

      # The identity is this workflow file on a faultbox-v tag of this repository, issued by GitHub's OIDC provider.
      - name: Verify signature and SBOMs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          identity="^https://github\.com/${REPOSITORY//./\\.}/\.github/workflows/faultbox-image\.yml@refs/tags/faultbox-v[0-9].*$"
          issuer="https://token.actions.githubusercontent.com"
          cosign verify \
            --certificate-identity-regexp "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${IMAGE}@${DIGEST}" > /dev/null
          for child in "${AMD64}" "${ARM64}"; do
            cosign verify-attestation --type spdxjson \
              --certificate-identity-regexp "${identity}" \
              --certificate-oidc-issuer "${issuer}" \
              "${IMAGE}@${child}" > /dev/null
          done

      - name: Show the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
