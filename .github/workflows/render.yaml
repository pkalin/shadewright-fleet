name: Render

# Renders every kustomization Flux applies (clusters/, infrastructure/, apps/) and validates it against the Kubernetes and Flux schemas (scripts/render.sh).
# The job name "Render manifests" is meant to be a required check on main. Runs on every pull request, with
# no path filter, so a required check is never left pending. Reads the repository only: no secrets.
on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render manifests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned by version and checksum in scripts/tools.env, the same versions the scenario harness renders with.
      - name: Install kustomize and kubeconform
        run: scripts/install-tools.sh kustomize kubeconform

      - name: Render and validate
        run: scripts/render.sh
