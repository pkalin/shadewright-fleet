name: Path guard

# Fails a pull request that changes anything outside the paths in .github/shadewright-paths.txt (design 8.1, 8.4).
# Trusted by construction: the allow list and the matching script both come from the BASE commit of the pull
# request, so the pull request cannot change the rules it is judged by. Nothing from the pull request head is
# checked out or run: the changed paths come from the GitHub API (renames list the old and the new path).
# Not pull_request_target. No path filter, so the check reports on every pull request and can be required.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions: {}

concurrency:
  group: path-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  path-guard:
    name: Path guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    steps:
      - name: Clone the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: List the changed paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/pulls/${PR}/files?per_page=100" >"${RUNNER_TEMP}/files.json"
          jq -s '[.[][] | .filename, .previous_filename | select(. != null)] | unique' "${RUNNER_TEMP}/files.json" >"${RUNNER_TEMP}/changed.json"
          # The files endpoint stops at 3000 files: with more changes than listed, fail rather than guess.
          listed="$(gh api "repos/${REPO}/pulls/${PR}" --jq .changed_files)"
          files="$(jq -s '[.[][]] | length' "${RUNNER_TEMP}/files.json")"
          if [ "$files" -ne "$listed" ]; then
            echo "path guard: the API listed ${files} files, the pull request has ${listed}" >&2
            exit 1
          fi

      - name: Check the paths against the base allow list
        run: python3 -I scripts/path_guard.py .github/shadewright-paths.txt <"${RUNNER_TEMP}/changed.json"
