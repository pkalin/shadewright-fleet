# Lab values for the Shadewright HelmRelease that every model provider shares: the base of the variants next to this
# directory, which the Flux Kustomization "shadewright" applies (clusters/lab/shadewright.yaml).
# Every ${VAR} is a Flux postBuild substitution that shadewright-azure (lab/flux.tf) fills from its Terraform outputs;
# nothing environment-specific is committed. The chart sets the workload identity annotation on each ServiceAccount
# and the label that asks the AKS webhook to inject the federated token into the pod; the two identities stay
# separate (invariant 6), and the chart refuses to render if both client IDs are the same.
#
#   Variable             Source (shadewright-azure)                                              Used for
#   ANALYZER_CLIENT_ID   foundation output analyzer_identity, field client_id                    analyzer.identity.azure.clientId
#   EXECUTOR_CLIENT_ID   foundation output executor_identity, field client_id                    executor.identity.azure.clientId
#
# Analysis (evaluation run only, not production; operator docs/lab-oom-acceptance.md, "Evaluation run"): the model
# provider is not set here. The lab holds one variant per provider next to this directory (foundry, anthropic, openai),
# each a kustomization over this base that adds triageModel and the provider's own values; the Flux Kustomization
# "shadewright" applies one of them (clusters/lab/shadewright.yaml, README, "Model provider"). Each variant says
# how its model is reached and which Secret it needs. No escalationModel in any of them: the lab has a single triage
# model, so read tools (offered only to the escalation model) are off and an escalation signal hands the Incident
# off (operator issue #80).
#
# prometheus.url is the lab Prometheus (infrastructure/prometheus, Service port 80) as the analyzer's metrics source;
# without it the context has no metrics and an OOM Incident is handed off with MissingData. networkPolicy.analyzer.
# prometheus opens the analyzer's egress to that server (container port 9090), and the ingress side is the policy
# in infrastructure/prometheus/networkpolicy-server.yaml.
# actionPolicies names the RemediationPolicies in infrastructure/shadewright-lab-config. The daily cap lives in the
# RemediationSettings there (analysis.maxAnalysesPerDay, 180 for the lab), with the endpoint and deployment; the chart
# has no value for it.
# executor.reviewerHints.enabled turns reviewer hints on (operator ADR-0028, off by default) for the lab runbook
# docs/lab-oom-hint.md. The cluster/* ruleset must require the check shadewright/review from the Shadewright App (README,
# "Reviewer hints and the shadewright/review check"); without that rule the check does not hold a steered change.
#
# The federated credentials of both identities name the namespace shadewright-system and the ServiceAccounts
# shadewright-analyzer and shadewright-executor (lab/federation.tf: operator_namespace, analyzer_service_account and
# executor_service_account), which is what the chart creates for the release shadewright in that namespace.
# Changing either side needs both.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../shadewright
patches:
  - target:
      kind: HelmRelease
      name: shadewright
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: shadewright
        namespace: flux-system
      spec:
        values:
          analyzer:
            prometheus:
              url: http://prometheus-server.prometheus.svc
            analysis:
              actionPolicies:
                SetContainerMemoryLimit: demo-memory
                AdjustKedaMaxReplicas: demo-keda
            identity:
              azure:
                clientId: "${ANALYZER_CLIENT_ID}"
          executor:
            reviewerHints:
              enabled: true
            identity:
              azure:
                clientId: "${EXECUTOR_CLIENT_ID}"
          networkPolicy:
            analyzer:
              prometheus:
                enabled: true
                namespace: prometheus
                podLabels:
                  app.kubernetes.io/name: prometheus
                  app.kubernetes.io/component: server
                port: 9090
