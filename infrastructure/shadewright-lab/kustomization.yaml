# Lab values for the Shadewright HelmRelease, applied by the Flux Kustomization "shadewright" (clusters/lab/shadewright.yaml).
# Every ${VAR} is a Flux postBuild substitution that shadewright-azure (lab/flux.tf) fills from its Terraform outputs;
# nothing environment-specific is committed. The chart sets the workload identity annotation on each ServiceAccount
# and the label that asks the AKS webhook to inject the federated token into the pod; the two identities stay
# separate (invariant 6), and the chart refuses to render if both client IDs are the same.
#
#   Variable             Source (shadewright-azure)                                              Used for
#   ANALYZER_CLIENT_ID   foundation output analyzer_identity, field client_id                    analyzer.identity.azure.clientId
#   EXECUTOR_CLIENT_ID   foundation output executor_identity, field client_id                    executor.identity.azure.clientId
#   MODEL_ENDPOINT_SUFFIX  "." plus the host of foundation output model_endpoint                  analyzer.analysis.endpointSuffixes
#
# Analysis (evaluation run only, not production; operator docs/lab-oom-acceptance.md, "Evaluation run"): triageModel
# is the model of the foundation deployment "triage" as its replies name it (<name>-<version>, from
# foundation/terraform.tfvars.example). endpointSuffixes lists the lab's own AI Services account host only, so no other
# resource receives the context or a token. escalationModel is the same model as triageModel: the lab has no second
# deployment, so escalation uses the triage deployment until the model choice ADR (operator issue #80) decides. Read
# tools are offered only to the escalation model, and without one an escalation signal hands the Incident off.
# prometheus.url is the lab Prometheus (infrastructure/prometheus, Service port 80) as the analyzer's metrics source;
# without it the context has no metrics and an OOM Incident is handed off with MissingData. networkPolicy.analyzer.
# prometheus opens the analyzer's egress to that server (container port 9090), and the ingress side is the policy
# in infrastructure/prometheus/networkpolicy-server.yaml.
# actionPolicies names the RemediationPolicy in infrastructure/shadewright-lab-config. The daily cap lives in the
# RemediationSettings there (analysis.maxAnalysesPerDay, 10 for the lab), with the endpoint and deployment; the chart
# has no value for it.
#
# The federated credentials of both identities name the namespace shadewright-system and the ServiceAccounts
# shadewright-analyzer and shadewright-executor (lab/federation.tf: operator_namespace, analyzer_service_account and
# executor_service_account), which is what the chart creates for the release shadewright in that namespace.
# Changing either side needs both.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../shadewright
patches:
  - target:
      kind: HelmRelease
      name: shadewright
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: shadewright
        namespace: flux-system
      spec:
        values:
          analyzer:
            prometheus:
              url: http://prometheus-server.prometheus.svc
            analysis:
              triageModel: gpt-5.4-mini-2026-03-17
              escalationModel: gpt-5.4-mini-2026-03-17
              endpointSuffixes:
                - "${MODEL_ENDPOINT_SUFFIX}"
              actionPolicies:
                SetContainerMemoryLimit: demo-memory
            identity:
              azure:
                clientId: "${ANALYZER_CLIENT_ID}"
          executor:
            identity:
              azure:
                clientId: "${EXECUTOR_CLIENT_ID}"
          networkPolicy:
            analyzer:
              prometheus:
                enabled: true
                namespace: prometheus
                podLabels:
                  app.kubernetes.io/name: prometheus
                  app.kubernetes.io/component: server
                port: 9090
