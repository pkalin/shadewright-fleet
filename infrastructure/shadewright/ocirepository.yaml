# The released Shadewright chart (0.4.0), pinned by digest, never by tag or range, so the chart
# cannot change under Flux. source-controller verifies the cosign keyless signature (GitHub OIDC) of that digest and
# accepts only the chart workflow of the release tag below. The chart pins the executor and analyzer image digests
# itself. To upgrade: take the chart digest and tag from the release notes, check them with `cosign verify` (see the
# operator repository's docs/upgrade-uninstall.md), then change the digest and the tag in the subject together.
# Same namespace as the HelmRelease: the lab's Flux runs with --no-cross-namespace-refs.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: shadewright
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/pkalin/charts/shadewright
  ref:
    digest: sha256:d4d92dfad51ed9a2bc5d091514b4a5583702e751663a62a957ceaa7a25b2280d
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: ^https://token\.actions\.githubusercontent\.com$
        subject: ^https://github\.com/pkalin/shadewright/\.github/workflows/chart\.yml@refs/tags/v0\.4\.0$
