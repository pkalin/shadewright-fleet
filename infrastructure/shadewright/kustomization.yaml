# The Shadewright agent from the released chart (OCIRepository, HelmRelease) and its namespace. Not listed in
# infrastructure/kustomization.yaml: it needs the lab's workload identities, so only clusters/lab applies it, through
# ../shadewright-lab. The Kind cluster does not install the agent through Flux (README, "Kind").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - ocirepository.yaml
  - helmrelease.yaml
