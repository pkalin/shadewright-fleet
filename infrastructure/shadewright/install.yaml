                x-kubernetes-list-type: map
                x-kubernetes-validations:
                - message: repository URLs must be unique
                  rule: self.all(r, self.exists_one(s, s.url == r.url))
            type: object
          status:
            description: status reports whether the settings are usable.
            properties:
              conditions:
                description: conditions report problems such as an unreachable signer.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              integrations:
                description: |-
                  integrations lists every integration module that is enabled or detected, with whether it is active.
                  A detected add-on whose module is not enabled is listed too, so the cluster admin sees what could be
                  enabled. Written like platform; empty until then. At most 64: 32 enabled (the spec cap) and 32 more
                  detected, since a detected add-on needs a compiled-in module and internal/modules refuses more than 32.
                items:
                  description: |-
                    IntegrationStatus reports one integration module that is enabled, detected or both. It is a report only:
                    the analyzer never reads it back to decide which integrations are active, it decides again from
                    spec.modules and live detection each time.
                  properties:
                    active:
                      description: |-
                        active is true when the module contributes hooks: it is enabled in spec.modules.integrations and
                        detected. It reports that decision and never feeds it.
                      type: boolean
                    detected:
                      description: |-
                        detected is true when the cluster serves one of the group versions the module declares. An enabled
                        name that no compiled-in module has is never detected.
                      type: boolean
                    name:
                      description: name is the integration module.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$
                      type: string
                    version:
                      description: |-
                        version is the group version that detected the add-on, in discovery form (keda.sh/v1alpha1). Set if
                        and only if the add-on is detected.
                      maxLength: 253
                      minLength: 1
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?v[0-9]+((alpha|beta)[0-9]+)?$
                      type: string
                  required:
                  - active
                  - detected
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: version is set if and only if the integration is detected
                    rule: self.detected == has(self.version)
                  - message: an integration that is not detected is not active
                    rule: '!self.active || self.detected'
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the generation the status describes.
                format: int64
                type: integer
              platform:
                description: |-
                  platform is the platform the analyzer detected and the one it uses. To be written by the analyzer once
                  detection is wired (planned, #61); no identity may write it yet, so it stays unset. The analyzer only
                  reads RemediationSettings today (AGENTS.md invariant 6): the status write #61 needs changes that
                  invariant and needs an ADR first. Status is a report, never an input.
                properties:
                  active:
                    description: |-
                      active is the platform whose module contributes hooks: detected when it is enabled in
                      spec.modules.platforms, generic otherwise.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                  detected:
                    description: detected is the platform that claims every node with
                      certainty. Left out when none does.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$
                    type: string
                required:
                - active
                type: object
                x-kubernetes-validations:
                - message: detected is left out, not generic, when no platform claims
                    the cluster
                  rule: '!has(self.detected) || self.detected != ''generic'''
                - message: active is generic or the detected platform
                  rule: self.active == 'generic' || (has(self.detected) && self.active
                    == self.detected)
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: there is one RemediationSettings and it is named default
          rule: self.metadata.name == 'default'
    served: true
    storage: true
    subresources:
      status: {}
