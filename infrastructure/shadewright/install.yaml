apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: incidents.remediation.shadewright.io
spec:
  group: remediation.shadewright.io
  names:
    categories:
    - shadewright
    kind: Incident
    listKind: IncidentList
    plural: incidents
    singular: incident
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.subject.kind
      name: Kind
      type: string
    - jsonPath: .spec.subject.name
      name: Subject
      type: string
    - jsonPath: .spec.reason
      name: Reason
      type: string
    - jsonPath: .status.count
      name: Count
      type: integer
    - jsonPath: .status.lastSeen
      name: Last seen
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Incident groups repeated symptoms of one problem on one workload.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec identifies the incident.
            properties:
              fingerprint:
                description: |-
                  fingerprint is the hash of cluster, namespace, owner, reason, action, type, reporting controller and
                  normalized symptom.
                pattern: ^sha256:[0-9a-f]{64}$
                type: string
              reason:
                description: reason is the event reason or status reason, for example
                  FailedScheduling or OOMKilled.
                maxLength: 128
                minLength: 1
                type: string
              reportingController:
                description: reportingController is the component that reported the
                  symptom.
                maxLength: 253
                type: string
              subject:
                description: 'subject is the object the symptoms are correlated to:
                  the owning workload when there is one.'
                properties:
                  apiVersion:
                    description: apiVersion of the object, for example apps/v1 or
                      keda.sh/v1alpha1.
                    maxLength: 253
                    minLength: 1
                    pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?v[0-9]+((alpha|beta)[0-9]+)?$
                    type: string
                  kind:
                    description: kind of the object.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[A-Z][A-Za-z0-9]*$
                    type: string
                  name:
                    description: name of the object.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: namespace of the object; empty for cluster-scoped
                      objects.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    description: uid of the object.
                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              symptom:
                description: 'symptom is the normalized, redacted description: variable
                  parts removed, secrets never included.'
                maxLength: 1024
                type: string
              type:
                default: Warning
                description: type is the event type.
                enum:
                - Normal
                - Warning
                type: string
            required:
            - fingerprint
            - reason
            - subject
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; a different symptom is a new Incident
              rule: self == oldSelf
          status:
            description: status is the deduplication state.
            properties:
              analysisRecords:
                description: analysisRecords are the newest analysis record IDs, oldest
                  first.
                items:
                  description: RecordID identifies an analysis record in the analysis
                    store.
                  maxLength: 256
                  minLength: 1
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              conditions:
                description: conditions explain the phase.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              count:
                description: |-
                  count is the number of occurrences counted, counting event series increments, not totals. It
                  saturates at 1,000,000: a series count is written by whoever can create events, so forged updates can
                  raise it without bound otherwise. It is not a count of distinct occurrences.
                format: int64
                maximum: 1000000
                minimum: 0
                type: integer
              firstSeen:
                description: firstSeen is when the first observation arrived.
                format: date-time
                type: string
              lastAnalysisTime:
                description: lastAnalysisTime is when the analyzer last ran; it drives
                  the cooldown.
                format: date-time
                type: string
              lastSeen:
                description: lastSeen is when the latest observation arrived.
                format: date-time
                type: string
              occurrences:
                description: |-
                  occurrences are the newest occurrences counted for this incident, newest first, at most 32: for each,
                  the highest total the cluster reported that was counted, and when it began. After a restart the
                  analyzer reads them to count only what is new. Older ones are dropped.
                items:
                  description: OccurrenceRecord is what an Incident counted of one
                    occurrence (design 3.2). It holds no event text.
                  properties:
                    began:
                      description: |-
                        began is when the occurrence began: the event's creation time or the termination's finish time.
                        Absent when the cluster did not report one.
                      format: date-time
                      type: string
                    id:
                      description: |-
                        id names the occurrence: "event:" and the Event UID, or "termination:" and a hash of the pod UID, the
                        container and the termination.
                      maxLength: 76
                      pattern: ^(event|termination):[A-Za-z0-9-]{1,64}$
                      type: string
                    total:
                      description: |-
                        total is the highest total of the occurrence counted: the event's series count, or 1 for a
                        termination.
                      format: int64
                      maximum: 2147483647
                      minimum: 0
                      type: integer
                  required:
                  - id
                  - total
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-type: atomic
              occurrencesDroppedThrough:
                description: |-
                  occurrencesDroppedThrough is when the newest occurrence dropped from occurrences began. An occurrence
                  with no record that began no later than this is treated as counted in full, so the bound never counts
                  one twice.
                format: date-time
                type: string
              phase:
                description: phase summarizes the incident.
                enum:
                - Open
                - Analyzing
                - Proposed
                - Escalated
                - Resolved
                type: string
              remediationRequests:
                description: remediationRequests are the names of requests made for
                  this incident, oldest first.
                items:
                  description: Name is a DNS label used to reference other Shadewright
                    objects or entries.
                  maxLength: 63
                  minLength: 1
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
