apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: analyzer
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: shadewright
    control-plane: analyzer
  name: shadewright-analyzer
  namespace: shadewright-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: analyzer
      app.kubernetes.io/name: shadewright
      control-plane: analyzer
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: analyzer
      labels:
        app.kubernetes.io/component: analyzer
        app.kubernetes.io/name: shadewright
        control-plane: analyzer
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --watch-namespaces=demo
        - --cluster-id=lab
        command:
        - /analyzer
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        image: ghcr.io/pkalin/shadewright-analyzer@sha256:8b64783fe9fc7675c10b6cf7cf5ca2ac0b1d5661b257e4c0587fe4e75ab8c59c
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: analyzer
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        readinessProbe:
          httpGet:
