# A minimal Prometheus for the lab (ADR-0017): the server with kube-state-metrics and the kubelet and cAdvisor
# targets, 24h retention on an emptyDir (the lab has no CSI drivers, shadewright-azure lab/aks.tf). No
# Alertmanager, node exporter, Pushgateway or Grafana. The analyzer and the KEDA Prometheus scaler query it at
# http://prometheus-server.prometheus.svc (port 80).
#
# Chart: https://github.com/prometheus-community/helm-charts (prometheus 29.40.3, app v3.15.1, with
# kube-state-metrics 8.8.0, app v2.20.0). Digests are the multi-arch index digests published on quay.io and
# registry.k8s.io for the tags below. Bump chart, tags and digests together.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 30m
  releaseName: prometheus
  targetNamespace: prometheus
  storageNamespace: prometheus
  chart:
    spec:
      chart: prometheus
      version: "29.40.3"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart's ClusterRole grants cluster-wide reads of configmaps and ingresses that no job here uses, so
    # it is off and rbac-*.yaml next to this file grant only what the scrape jobs need.
    rbac:
      create: false
    alertmanager:
      enabled: false
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false

    configmapReload:
      prometheus:
        image:
          tag: "v0.94.2@sha256:a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71"
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi

    server:
      image:
        tag: "v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2"
      replicaCount: 1
      retention: 24h
      retentionSize: 1GB
      persistentVolume:
        enabled: false
      emptyDir:
        sizeLimit: 2Gi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      # Prometheus 3 sets GOMEMLIMIT from the memory limit, so it collects garbage before the limit is hit.
      resources:
        requests:
          cpu: 100m
          memory: 320Mi
        limits:
          cpu: 500m
          memory: 640Mi

    kube-state-metrics:
      image:
        tag: "v2.20.0"
        sha: "sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b"
      # Only the objects the scenarios look at. Leaving out secrets and configmaps also keeps them out of its
      # ClusterRole.
      collectors:
        - daemonsets
        - deployments
        - horizontalpodautoscalers
        - jobs
        - namespaces
        - nodes
        - pods
        - replicasets
        - statefulsets
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          cpu: 100m
          memory: 128Mi

    # Scrape jobs: Prometheus itself, kubelet and cAdvisor (nodes, port 10250), kube-state-metrics (annotated
    # Service in this namespace) and annotated pods in demo. The other default jobs are off: they would need
    # Pushgateway, a blackbox exporter, or network paths the NetworkPolicies here do not open.
    #
    # Kubelet and cAdvisor are scraped directly, with the kubelet's serving certificate verified against the
    # cluster CA (AKS signs it with the cluster CA on 1.27 and later), instead of the chart's
    # insecure_skip_verify. Scraping through the API server proxy would need get on nodes/proxy, which the
    # Kubernetes RBAC good practices treat as command execution on the nodes; direct scrapes need only
    # nodes/metrics. On Kind, whose kubelets self-sign, these two jobs fail and the rest still work.
    scrapeConfigs:
      kubernetes-nodes:
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: false
      kubernetes-nodes-cadvisor:
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: false
      kubernetes-api-servers:
        enabled: false
      kubernetes-service-endpoints:
        kubernetes_sd_configs:
          - role: endpointslice
            namespaces:
              names:
                - prometheus
      kubernetes-service-endpoints-slow:
        enabled: false
      prometheus-pushgateway:
        enabled: false
      kubernetes-services:
        enabled: false
      # Every 15s for the demo pods only (a handful of series), so KEDA's rate() window holds enough samples.
      # honor_labels is off (the chart's default is on): a pod in demo is a tenant, and with it on, the labels it
      # exposes (namespace, pod, container, job, instance) win over the ones Prometheus sets, so a pod could
      # publish a series in another pod's or namespace's name, for example a kube-state-metrics name the
      # analyzer reads as evidence. Off, a clashing label is kept as exported_<name> and the target's own labels
      # stay authoritative. KEDA's query uses only labels Prometheus sets (namespace, app_kubernetes_io_name).
      kubernetes-pods:
        honor_labels: false
        scrape_interval: 15s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - demo
      kubernetes-pods-slow:
        enabled: false
