# Every pod here talks to the Kubernetes API. The API server's address is environment-specific (no IPs in this
# repository) and Cilium gives it a reserved identity that ipBlock rules do not match, so the rule opens the
# port to any destination: 443 on AKS, 6443 on Kind.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver
  namespace: prometheus
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
