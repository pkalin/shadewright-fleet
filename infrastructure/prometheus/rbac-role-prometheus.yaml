# Service discovery in prometheus only, for the service endpoints job (kube-state-metrics): EndpointSlices,
# plus their Services and Pods for target labels.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-server-discovery
  namespace: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
