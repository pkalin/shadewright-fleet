# Service discovery in demo only, for the pod job: annotated pods in demo.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus-server-discovery
  namespace: demo
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
