# The lab's RemediationSettings (operator config/samples/lab), for an evaluation run with the model analysis on
# (infrastructure/shadewright-lab). maxAnalysesPerDay caps the model calls per UTC day; set it to 0 here to stop
# the analysis without a chart change. No key anywhere: the analyzer reaches the model and the executor signs
# with Key Vault through their workload identities.
apiVersion: remediation.shadewright.io/v1alpha1
kind: RemediationSettings
metadata:
  name: default
spec:
  paused: false
  # Cap on active requests (before the merge): more wait in Pending with the condition Queued.
  maxConcurrentRemediations: 1
  # The KEDA module: its symptom sources (trigger errors, not ready, replica ceiling) open Incidents only while it is
  # listed here (operator #478, since v0.3.0-rc.5); detected alone it stays inactive. Needed by keda-at-ceiling and
  # broken-keda-trigger.
  modules:
    integrations: [keda]
  repositories:
    - name: fleet
      url: "${FLEET_REPOSITORY_URL}"
      targetBranch: "${FLEET_BRANCH}"
      provider: GitHub
      github:
        appClientID: "${GITHUB_APP_CLIENT_ID}"
        # The number with the prefix "id" that clusters/lab/shadewright-config.yaml forwards it with removed.
        installationID: ${GITHUB_APP_INSTALLATION_ID/id/}
        signer:
          azureKeyVault:
            keyID: "${GITHUB_APP_KEY_ID}"
  analysis:
    # Lab values for a full-day run of the scenario matrix (twelve rows), not a recommendation. The run of 2026-11-14
    # used 6 of 10 analyses on two scenarios, because one OOM opens three Incidents and each is analyzed (operator
    # #432). About 3,500 tokens per analysis on gpt-5.4-mini: 40 analyses are about 140k tokens, well under the token
    # cap below (800000, the old 200000 at the same ratio to the count).
    maxAnalysesPerDay: 40
    models:
      triage:
        endpoint: "${MODEL_ENDPOINT}"
        # The foundation deployment whose model is infrastructure/shadewright-lab's triageModel.
        deployment: triage
        apiVersion: "2024-10-21"
        maxTokensPerDay: 800000
      # No escalation model: the CRD refuses triage and escalation on the same endpoint and deployment, and the lab
      # has one deployment. Escalation (the read tools) needs a second foundation deployment (operator issue #80).
